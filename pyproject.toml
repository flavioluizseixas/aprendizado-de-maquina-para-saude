[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aprendizado-maquina-saude"
version = "1.0.0"
description = "Notebooks didáticos de aprendizado de máquina aplicado à saúde"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Flavio Luiz Seixas" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
supervised = [
  "ucimlrepo>=0.0.7,<1",
  "shap>=0.45,<1",
  "statsmodels>=0.14,<1",
  "jupyterlab>=4,<5",
]
clustering = [
  "ucimlrepo>=0.0.7,<1",
  "kneed>=0.8,<1",
  "jupyterlab>=4,<5",
]
model-comparison = [
  "ucimlrepo>=0.0.7,<1",
  "jupyterlab>=4,<5",
]
imaging = [
  "medmnist>=3,<4",
  "tensorflow>=2.16,<3; platform_system != 'Darwin' or platform_machine != 'arm64'",
  "jupyterlab>=4,<5",
]
survival = [
  "lifelines>=0.30,<1",
  "jupyterlab>=4,<5",
]
reinforcement = [
  "jupyterlab>=4,<5",
]
time-series = [
  "statsmodels>=0.14,<1",
  "jupyterlab>=4,<5",
]
notebooks = [
  "ucimlrepo>=0.0.7,<1",
  "shap>=0.45,<1",
  "lifelines>=0.30,<1",
  "medmnist>=3,<4",
  "kneed>=0.8,<1",
  "statsmodels>=0.14,<1",
  "tensorflow>=2.16,<3; platform_system != 'Darwin' or platform_machine != 'arm64'",
  "jupyterlab>=4,<5",
  "nbformat>=5.10,<6",
]
dev = ["pytest>=8,<9", "nbformat>=5.10,<6"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
